name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Runner images change their preinstalled simulators, so resolve one at
      # run time instead of hard-coding a device name.
      - name: Resolve a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E '^[[:space:]]*iPhone' \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then echo "No iPhone simulator available"; exit 1; fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test NudgeCore
        working-directory: Packages/NudgeCore
        run: xcodebuild test -scheme NudgeCore -destination "id=${{ steps.sim.outputs.udid }}" -quiet

      - name: Test DesignSystem
        working-directory: Packages/DesignSystem
        run: xcodebuild test -scheme DesignSystem -destination "id=${{ steps.sim.outputs.udid }}" -quiet

      # UI tests are excluded: they add minutes and cover none of the logic.
      - name: Test app
        run: |
          xcodebuild test \
            -scheme Nudge \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skip-testing:NudgeUITests \
            -quiet

  format:
    name: Format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint formatting
        run: ./Scripts/format.sh --lint
