name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Test NudgeCore
        working-directory: Packages/NudgeCore
        run: |
          xcodebuild test \
            -scheme NudgeCore \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            | xcbeautify
        shell: bash

      - name: Test DesignSystem
        working-directory: Packages/DesignSystem
        run: |
          xcodebuild test \
            -scheme DesignSystem \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            | xcbeautify
        shell: bash

  format:
    name: Format
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app
      - name: Lint formatting
        run: ./Scripts/format.sh --lint
